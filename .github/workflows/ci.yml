name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env must not be committed"; exit 1; fi
          if git grep -nE '(gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- ':!*.lock'; then
            echo "possible secret committed"; exit 1; fi
      - name: Prompts live in agent/prompts only
        run: uv run python -m scripts.ci_checks prompts
      - name: Unit + MCP server tests
        run: uv run pytest -q mcp_servers gigsim tests/unit tests/integration
      - name: Contract (MCP tool-schema snapshots)
        run: uv run pytest -q tests/contract
