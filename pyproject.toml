[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "langgraph>=0.6",
  "langchain>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.12",
  "rank-bm25>=0.2.2",
  "tzdata>=2026.6",
  "cryptography>=50.0.2",
  "fastembed>=0.9.1",
  "langchain-openai>=1.7.4",
  "sqlalchemy>=2.0",
  "pyjwt>=2.8",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "langgraph-checkpoint-postgres>=3.2.0",
  "psycopg[binary]>=3.3.8",
  "arq>=0.28.0",
  "redis>=5.3.1",
  "sse-starlette>=3.7.0",
  "aiosqlite>=0.22.1",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# data/ holds the generated portfolio corpus: its "unused" imports ARE the evidence (implied skills)
extend-exclude = ["data"]

[tool.ruff.lint.per-file-ignores]
"apps/api/**" = ["B008"]   # FastAPI dependency-injection idiom: Depends()/File() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers", "gigsim"]
asyncio_default_fixture_loop_scope = "function"
