[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "langgraph>=0.6",
  "langchain>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.12",
  "rank-bm25>=0.2.2",
  "tzdata>=2026.6",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# data/ holds the generated portfolio corpus: its "unused" imports ARE the evidence (implied skills)
extend-exclude = ["data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers", "gigsim"]
asyncio_default_fixture_loop_scope = "function"
